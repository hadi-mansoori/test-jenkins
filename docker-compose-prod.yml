services:
  express-app:
    build:
      context: .
      dockerfile: Dockerfile
      container_name: express_app_production
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./src:/app/src
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    command: npm run
