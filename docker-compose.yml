services:
  express-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_app_stage
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./src:/app/src
    environment:
      - NODE_ENV=development
      - PORT=3000
    restart: unless-stopped
    command: npm start dev
